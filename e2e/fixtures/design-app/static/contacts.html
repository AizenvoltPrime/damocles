<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; padding: 1.5rem; max-width: 60rem; }
    header { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 1.5rem; }
    input, select, button { font: inherit; padding: 0.5rem 0.75rem; border: 1px solid #8a8a99; border-radius: 0.5rem; }
    button { background: #4b3fd1; color: #fff; border-color: #4b3fd1; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 1rem 0 0; }
    li { display: flex; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid #e3e3ea; }
    li span:last-child { color: #55556a; }
    [popover] { padding: 1.5rem; border: 1px solid #c7c7d4; border-radius: 0.75rem; width: min(24rem, calc(100vw - 3rem)); }
    [popover] label { display: block; margin-top: 0.75rem; }
    [popover] input, [popover] select { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <header>
    <h1>Contacts</h1>
    <input type="search" placeholder="Search contacts" aria-label="Search contacts">
    <button type="button" popovertarget="new-contact">Add contact</button>
  </header>
  <ul aria-label="Contacts">
    <li><span>Grace Hopper</span> <span>grace@example.com</span></li>
    <li><span>Alan Turing</span> <span>alan@example.com</span></li>
    <li><span>Katherine Johnson</span> <span>katherine@example.com</span></li>
  </ul>
  <div id="new-contact" popover role="dialog" aria-label="New contact">
    <label for="c-name">Name</label>
    <input id="c-name" autocomplete="off">
    <label for="c-group">Group</label>
    <select id="c-group">
      <option value="">None</option>
      <option value="work">Work</option>
      <option value="family">Family</option>
    </select>
  </div>
  <script>
    // The search filters the list as the user types; the dialog is a native popover, which opens and closes with no script.
    const search = document.querySelector('input[type="search"]');
    search.addEventListener('input', () => {
      const wanted = search.value.trim().toLowerCase();
      for (const item of document.querySelectorAll('ul li')) item.hidden = wanted !== '' && !item.textContent.toLowerCase().includes(wanted);
    });
  </script>
</body>
</html>
