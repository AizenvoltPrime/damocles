<!doctype html>
<html lang="en" data-ds-screen="S1" data-ds-states="default">
<head><meta charset="utf-8"><title>Contacts</title><link rel="stylesheet" href="../tokens.css"></head>
<body style="margin: 0">
<div id="drawn"></div>
<main style="padding: 16px">
  <h1 style="color: var(--color-primary)">Contacts</h1>
  <input data-ds-component="Input" type="search" placeholder="Name or email">
</main>
<script>
  // Script-drawn on purpose: the band and the table exist only where the page's script ran.
  document.getElementById('drawn').style.cssText = 'height: 120px; background: var(--color-danger)';
  const table = document.createElement('div');
  table.dataset.dsComponent = 'Table';
  table.style.width = '812px';
  table.innerHTML = '<table><tr><td data-ds-bind="Contact.name">Ada Lovelace</td><td data-ds-bind="Contact.email">ada@example.com</td></tr></table>';
  document.querySelector('main').append(table);
</script>
</body>
</html>
