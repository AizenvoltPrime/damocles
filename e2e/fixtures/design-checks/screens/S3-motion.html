<!doctype html>
<html lang="en" data-ds-screen="S3" data-ds-states="default">
<head>
  <meta charset="utf-8">
  <title>Motion</title>
  <style>
    @font-face { font-family: 'Inter Fixture'; src: url('../assets/inter-var.woff2') format('woff2'); font-display: block; }
    html, body { margin: 0; background: #ffffff; }
    /* the boxes are placed absolutely, so the page takes its height from this one */
    main { position: relative; height: 700px; }
    /* a block font face draws nothing until the font loaded, so the stem shows only once it has */
    #glyph { position: absolute; left: 0; top: 0; width: 300px; height: 300px; font: 280px/300px 'Inter Fixture'; color: #dc2626; text-align: center; }
    #fade { position: absolute; left: 320px; top: 0; width: 60px; height: 300px; background: #16a34a; animation: fade 2s ease-in both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    #count { position: absolute; left: 0; top: 320px; width: 390px; height: 100px; background: #ffffff; font: 40px sans-serif; }
    #count.done { background: #2563eb; }
    #theme { position: absolute; left: 0; top: 440px; width: 390px; height: 200px; background: #facc15; }
    @media (prefers-color-scheme: dark) { #theme { background: #1e1b4b; } }
    @media (prefers-reduced-motion: reduce) { #fade { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div id="glyph">I</div>
    <div id="fade"></div>
    <div id="count">0</div>
    <div id="theme"></div>
  </main>
  <script>
    // a 2 s count-up a timer drives, which no CSS wait can finish; its end turns the box blue
    const count = document.getElementById('count');
    const finish = () => {
      count.textContent = '100';
      count.classList.add('done');
    };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
    else {
      let n = 0;
      const timer = setInterval(() => {
        n += 1;
        count.textContent = String(n);
        if (n >= 100) {
          clearInterval(timer);
          finish();
        }
      }, 20);
    }
  </script>
</body>
</html>
