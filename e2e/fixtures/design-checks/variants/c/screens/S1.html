<!doctype html>
<html lang="en" data-ds-screen="S1" data-ds-states="default">
<head><meta charset="utf-8"><title>Contacts · Split</title><link rel="stylesheet" href="../../../tokens.css"></head>
<body style="margin: 0; background: var(--color-muted)">
<main style="padding: 24px">
  <h1 style="color: var(--color-primary)">Contacts · Split</h1>
  <button data-ds-component="Button">Add contact</button>
  <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 16px">
    <ul style="margin: 0; padding: 16px; background: var(--color-surface)"><li data-ds-bind="Contact.name">Ada Lovelace</li><li>Grace Hopper</li><li>Alan Turing</li></ul>
    <section style="padding: 16px; background: var(--color-surface)"><h2>Ada Lovelace</h2><p data-ds-bind="Contact.email">ada@example.com</p></section>
  </div>
</main>
</body>
</html>
