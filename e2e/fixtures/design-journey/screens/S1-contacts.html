<!doctype html>
<html lang="en" data-ds-screen="S1" data-ds-states="default">
<head><meta charset="utf-8"><title>Contacts</title><link rel="stylesheet" href="../tokens.css"></head>
<body>
<main>
  <h1 style="color: var(--color-primary)">Contacts</h1>
  <input data-ds-component="Input" type="search" placeholder="Search contacts" aria-label="Search contacts">
  <button data-ds-component="Button" type="button" popovertarget="new-contact">Add contact</button>
  <ul aria-label="Contacts">
    <li><span data-ds-bind="Contact.name">Ada Lovelace</span> <span data-ds-bind="Contact.email">ada@example.com</span></li>
    <li><span data-ds-bind="Contact.name">Grace Hopper</span> <span data-ds-bind="Contact.email">grace@example.com</span></li>
    <li><span data-ds-bind="Contact.name">Alan Turing</span> <span data-ds-bind="Contact.email">alan@example.com</span></li>
  </ul>
  <div id="new-contact" popover role="dialog" aria-label="New contact">
    <label for="c-name">Name</label>
    <input data-ds-component="Input" id="c-name">
    <label for="c-group">Group</label>
    <select id="c-group">
      <option value="">None</option>
      <option value="work">Work</option>
      <option value="family">Family</option>
    </select>
  </div>
</main>
<script>
  const search = document.querySelector('input[type="search"]');
  search.addEventListener('input', () => {
    const query = search.value.trim().toLowerCase();
    for (const item of document.querySelectorAll('ul[aria-label="Contacts"] li')) item.hidden = query !== '' && !item.textContent.toLowerCase().includes(query);
  });
</script>
</body>
</html>
