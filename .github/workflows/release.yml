name: Create Release from Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 (current Active LTS). The smoke imports pi for real, which requires Node >=22.19.0
      # (undici 8.3.0); 24 satisfies that floor. The extension host itself runs Node 22 (Electron),
      # so @types/node stays pinned to 22 — this is the build/verify toolchain, not the runtime target.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "ERROR: package.json version ($pkg_version) does not match tag ($tag_version)" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Imports pi at runtime and asserts @earendil-works/pi-ai/compat exports a callable `complete`
      # (the contract pi-runtime.ts depends on). Fails loudly if a future pi release removes it.
      - name: Smoke test pi runtime contract
        run: npm run smoke:pi

      # Staleness gate runs once here (single platform, fail-fast before the matrix). The matrix's
      # vscode:prepublish regenerates the allowlist in-place per runner, so packaging never false-fails
      # on benign cross-OS dependency-closure drift — this only flags a committed file that drifted.
      - name: Verify .vscodeignore allowlist is in sync
        run: node scripts/sync-vscodeignore.mjs --check

  package:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
            rgPkg: ripgrep-win32-x64
            rgBin: rg.exe
            nativeAsset: node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node
            nativeReason: koffi job objects, without which a stopped command's background jobs survive
          - target: win32-arm64
            runner: windows-11-arm
            rgPkg: ripgrep-win32-arm64
            rgBin: rg.exe
            nativeAsset: node_modules/@koromix/koffi-win32-arm64/win32_arm64/koffi.node
            nativeReason: koffi job objects, without which a stopped command's background jobs survive
          - target: darwin-arm64
            runner: macos-latest
            rgPkg: ripgrep-darwin-arm64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
          - target: linux-x64
            runner: ubuntu-latest
            rgPkg: ripgrep-linux-x64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rgPkg: ripgrep-linux-arm64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
          - target: alpine-x64
            runner: ubuntu-latest
            alpineContainer: true
            rgPkg: ripgrep-linux-x64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
          - target: alpine-arm64
            runner: ubuntu-24.04-arm
            alpineContainer: true
            rgPkg: ripgrep-linux-arm64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
    runs-on: ${{ matrix.runner }}
    env:
      VSIX_NAME: damocles-${{ matrix.target }}-${{ github.ref_name }}.vsix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: ${{ !matrix.alpineContainer }}
        with:
          node-version: 24
          cache: npm

      - name: Build and package on host
        if: ${{ !matrix.alpineContainer }}
        shell: bash
        run: |
          npm ci
          npx @vscode/vsce package \
            --target ${{ matrix.target }} \
            --out "$VSIX_NAME"

      - name: Build and package in Alpine container
        if: ${{ matrix.alpineContainer }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e VSIX_NAME="$VSIX_NAME" \
            node:24-alpine sh -c '
              set -e
              apk add --no-cache git python3 make g++ libc6-compat
              cp -a /work /build
              cd /build
              npm ci
              npx @vscode/vsce package \
                --target ${{ matrix.target }} \
                --out "$VSIX_NAME"
              cp "$VSIX_NAME" "/work/$VSIX_NAME"
            '

      - name: Verify VSIX bundles the ripgrep binary
        shell: bash
        run: |
          listing=$(mktemp)
          unzip -l "$VSIX_NAME" > "$listing"
          rg_expected="extension/node_modules/@vscode/${{ matrix.rgPkg }}/bin/${{ matrix.rgBin }}"
          echo "Checking for: $rg_expected"
          if ! grep -qF "$rg_expected" "$listing"; then
            echo "ERROR: $VSIX_NAME is missing $rg_expected (ripgrep binary for @ file autocomplete)" >&2
            echo "--- VSIX contents ---"
            cat "$listing"
            exit 1
          fi
          size=$(wc -c < "$VSIX_NAME")
          echo "VSIX size: $size bytes"
          if [ "$size" -lt 30000000 ]; then
            echo "ERROR: VSIX is suspiciously small ($size bytes — bundled deps/assets likely missing)" >&2
            exit 1
          fi

      - name: Verify VSIX bundles this target's shell-cleanup asset
        shell: bash
        run: |
          listing=$(mktemp)
          unzip -l "$VSIX_NAME" > "$listing"
          expected="extension/${{ matrix.nativeAsset }}"
          echo "Checking for: $expected"
          if ! grep -qF "$expected" "$listing"; then
            echo "ERROR: $VSIX_NAME is missing $expected (${{ matrix.nativeReason }})" >&2
            echo "--- VSIX contents ---"
            cat "$listing"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: ${{ env.VSIX_NAME }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            BEGIN { found=0 }
            /^## / {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-body.md
          if [ ! -s /tmp/release-body.md ]; then
            echo "ERROR: No changelog section found for version $version" >&2
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-body.md \
            dist-artifacts/*.vsix
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: |
          publish_with_retry() {
            local vsix="$1"
            local max_attempts=4
            local attempt=1
            local log
            log=$(mktemp)
            while [ "$attempt" -le "$max_attempts" ]; do
              if npx @vscode/vsce publish --packagePath "$vsix" --pat "$VSCE_PAT" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if grep -qiE "already exists|already published" "$log"; then
                echo "Skipping $vsix - already published"
                return 0
              fi
              local delay=$((attempt * 15))
              echo "Attempt $attempt failed for $vsix; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            echo "ERROR: Failed to publish $vsix after $max_attempts attempts" >&2
            return 1
          }
          for vsix in dist-artifacts/*.vsix; do
            echo "Publishing to VS Marketplace: $vsix"
            publish_with_retry "$vsix"
          done

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: |
          publish_with_retry() {
            local vsix="$1"
            local max_attempts=4
            local attempt=1
            local log
            log=$(mktemp)
            while [ "$attempt" -le "$max_attempts" ]; do
              if npx ovsx publish "$vsix" -p "$OVSX_PAT" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if grep -qiE "already exists|already published|conflict" "$log"; then
                echo "Skipping $vsix - already published"
                return 0
              fi
              local delay=$((attempt * 15))
              echo "Attempt $attempt failed for $vsix; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            echo "ERROR: Failed to publish $vsix after $max_attempts attempts" >&2
            return 1
          }
          for vsix in dist-artifacts/*.vsix; do
            echo "Publishing to Open VSX: $vsix"
            publish_with_retry "$vsix"
          done
