name: Create Release from Tag

on:
  push:
    tags:
      - 'v*'
  # A manual run builds and tests everything and publishes nothing (attest and release skip it). It signs Windows, with the SignPath
  # test certificate, only when `sign` is on, because every signing spends SignPath's yearly artifact quota.
  workflow_dispatch:
    inputs:
      sign:
        description: Sign Windows with the SignPath test certificate (spends SignPath's yearly artifact quota)
        type: boolean
        default: false

# The workflow token is read-only; only `attest` and `release` widen it, each in its own job.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 matches package.json engines. The smoke imports pi for real, which requires Node >=22.19.0 (undici 8.3.0).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The only download of the grammars and wake models in a run; every job that builds or tests restores fetched-assets
      # first, so fetch:assets finds the files present and skips the network (docs/release.md "The verify job").
      - name: Fetch the grammars and wake models
        run: npm run fetch:assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetched-assets
          path: |
            resources/grammars/*.wasm
            python/damocles_voice_sidecar/damocles_voice_sidecar/models/wake/*.onnx
            python/damocles_voice_sidecar/damocles_voice_sidecar/models/wake/tokens.txt
            python/damocles_voice_sidecar/damocles_voice_sidecar/models/wake/bpe.model
          retention-days: 1
          if-no-files-found: error

      - name: Verify package.json version matches tag
        if: github.event_name == 'push'
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "ERROR: package.json version ($pkg_version) does not match tag ($tag_version)" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      # Enforces the source layout boundaries: core never imports vscode or electron.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Imports pi for real with no auth and no network, and asserts three things: every pi subpath the
      # extension resolves is reachable, ModelRuntime.prototype.completeSimple is a function, and an agent
      # dir seeded with compaction.enabled=false yields a session with auto-compaction off.
      # See "The verify job" in docs/release.md.
      - name: Smoke test pi runtime contract
        run: npm run smoke:pi

      # Staleness gate runs once here (single platform, fail-fast before the matrix). The matrix's
      # vscode:prepublish regenerates the allowlist in-place per runner, so packaging never false-fails
      # on benign cross-OS dependency-closure drift — this only flags a committed file that drifted.
      - name: Verify .vscodeignore allowlist is in sync
        run: node scripts/sync-vscodeignore.mjs --check

  package:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
            rgPkg: ripgrep-win32-x64
            rgBin: rg.exe
            nativeAsset: node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node
            nativeReason: koffi job objects, without which a stopped command's background jobs survive
          - target: win32-arm64
            runner: windows-11-arm
            rgPkg: ripgrep-win32-arm64
            rgBin: rg.exe
            nativeAsset: node_modules/@koromix/koffi-win32-arm64/win32_arm64/koffi.node
            nativeReason: koffi job objects, without which a stopped command's background jobs survive
          - target: darwin-arm64
            runner: macos-latest
            rgPkg: ripgrep-darwin-arm64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
          - target: linux-x64
            runner: ubuntu-latest
            rgPkg: ripgrep-linux-x64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rgPkg: ripgrep-linux-arm64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
          - target: alpine-x64
            runner: ubuntu-latest
            alpineContainer: true
            rgPkg: ripgrep-linux-x64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
          - target: alpine-arm64
            runner: ubuntu-24.04-arm
            alpineContainer: true
            rgPkg: ripgrep-linux-arm64
            rgBin: rg
            nativeAsset: dist/sentinel.js
            nativeReason: the shell sentinel, without which a closed panel leaves process groups running
    runs-on: ${{ matrix.runner }}
    env:
      VSIX_NAME: damocles-${{ matrix.target }}-${{ github.ref_name }}.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !matrix.alpineContainer }}
        with:
          node-version: 24
          cache: npm

      # The Alpine container copies the workspace, these files included.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched-assets

      - name: Build and package on host
        if: ${{ !matrix.alpineContainer }}
        shell: bash
        run: |
          npm ci
          npm run package -- \
            --target ${{ matrix.target }} \
            --out "$VSIX_NAME"

      - name: Build and package in Alpine container
        if: ${{ matrix.alpineContainer }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e VSIX_NAME="$VSIX_NAME" \
            node:24-alpine sh -c '
              set -e
              apk add --no-cache git python3 make g++ libc6-compat
              cp -a /work /build
              cd /build
              npm ci
              npm run package -- \
                --target ${{ matrix.target }} \
                --out "$VSIX_NAME"
              cp "$VSIX_NAME" "/work/$VSIX_NAME"
            '

      - name: Verify VSIX bundles the ripgrep binary
        shell: bash
        run: |
          listing=$(mktemp)
          unzip -l "$VSIX_NAME" > "$listing"
          rg_expected="extension/node_modules/@vscode/${{ matrix.rgPkg }}/bin/${{ matrix.rgBin }}"
          echo "Checking for: $rg_expected"
          if ! grep -qF "$rg_expected" "$listing"; then
            echo "ERROR: $VSIX_NAME is missing $rg_expected (ripgrep binary for @ file autocomplete)" >&2
            echo "--- VSIX contents ---"
            cat "$listing"
            exit 1
          fi
          size=$(wc -c < "$VSIX_NAME")
          echo "VSIX size: $size bytes"
          if [ "$size" -lt 30000000 ]; then
            echo "ERROR: VSIX is suspiciously small ($size bytes — bundled deps/assets likely missing)" >&2
            exit 1
          fi

      - name: Verify VSIX bundles this target's shell-cleanup asset
        shell: bash
        run: |
          listing=$(mktemp)
          unzip -l "$VSIX_NAME" > "$listing"
          expected="extension/${{ matrix.nativeAsset }}"
          echo "Checking for: $expected"
          if ! grep -qF "$expected" "$listing"; then
            echo "ERROR: $VSIX_NAME is missing $expected (${{ matrix.nativeReason }})" >&2
            echo "--- VSIX contents ---"
            cat "$listing"
            exit 1
          fi

      # Alpine legs run this on the host's preinstalled Node; the listing mode reads no node_modules.
      - name: Verify VSIX carries no desktop-only file
        shell: bash
        run: |
          listing=$(mktemp)
          unzip -Z1 "$VSIX_NAME" > "$listing"
          node scripts/sync-vscodeignore.mjs --check-vsix-listing "$listing"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: ${{ env.VSIX_NAME }}
          retention-days: 7
          if-no-files-found: error

  # Keep this matrix in step with DESKTOP_TARGETS in scripts/release-targets.mjs (release-targets.test.ts fails on drift).
  # Every electron-builder call names its targets: without them, the `arch` lists in electron-builder.yml add architectures the runner cannot build.
  package-desktop:
    needs: verify
    strategy:
      # Each leg is a separate platform; `release` still needs every leg, so a failure reports all of them without publishing.
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-latest
            os: win32
            builder: win
            targets: nsis
            arch: x64
            channel: latest-x64
            appDir: dist-desktop/win-unpacked
            executable: dist-desktop/win-unpacked/Damocles.exe
          - target: win-arm64
            runner: windows-11-arm
            os: win32
            builder: win
            targets: nsis
            arch: arm64
            channel: latest-arm64
            appDir: dist-desktop/win-arm64-unpacked
            executable: dist-desktop/win-arm64-unpacked/Damocles.exe
            updateFeed: nsis
          - target: mac-arm64
            runner: macos-latest
            os: darwin
            builder: mac
            targets: dmg zip
            arch: arm64
            appDir: dist-desktop/mac-arm64/Damocles.app
            executable: dist-desktop/mac-arm64/Damocles.app/Contents/MacOS/Damocles
            updateFeed: zip
          - target: linux-x64
            runner: ubuntu-latest
            os: linux
            builder: linux
            targets: deb rpm
            arch: x64
            appDir: dist-desktop/linux-unpacked
            executable: dist-desktop/linux-unpacked/damocles
            updateFeed: deb
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            builder: linux
            targets: deb rpm
            arch: arm64
            appDir: dist-desktop/linux-arm64-unpacked
            executable: dist-desktop/linux-arm64-unpacked/damocles
    runs-on: ${{ matrix.runner }}
    # npm ci and the builds, the suite step's limit, then the installers and uploads (docs/release.md "Time limits").
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install rpm and Xvfb
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm xvfb

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched-assets

      - name: Build
        run: npm run build

      - name: Build desktop
        run: npm run build:desktop

      # Windows builds only the unpacked app here; sign-windows signs it and builds the installer from it (docs/desktop-signing.md).
      # The nsis target is required here: only it makes electron-builder write resources/app-update.yml, and --dir or --prepackaged never do.
      # The unsigned installer this also writes is never uploaded.
      - name: Build unpacked Windows app
        if: matrix.os == 'win32'
        run: npx electron-builder --win ${{ matrix.targets }} --${{ matrix.arch }} --publish never -c.publish.channel=${{ matrix.channel }}

      - name: Build macOS and Linux installers
        if: matrix.os != 'win32'
        run: npx electron-builder --${{ matrix.builder }} ${{ matrix.targets }} --${{ matrix.arch }} --publish never

      - name: Verify desktop package integrity and fuses
        run: node scripts/verify-desktop-package.mjs --platform ${{ matrix.os }} --arch ${{ matrix.arch }} --app "${{ matrix.appDir }}"

      # Ubuntu 24.04 restricts unprivileged user namespaces for binaries without an AppArmor profile, so Chromium needs its setuid helper; the sandbox stays on.
      - name: Enable the setuid sandbox helper of the packaged app
        if: matrix.os == 'linux'
        run: |
          sudo chown root:root "${{ matrix.appDir }}/chrome-sandbox"
          sudo chmod 4755 "${{ matrix.appDir }}/chrome-sandbox"

      - name: End-to-end suite against the packaged app
        # Outlasts globalTimeout; fails only this step, so the e2e-report upload still runs (docs/release.md "Time limits").
        timeout-minutes: 55
        env:
          DAMOCLES_E2E_PACKAGED_APP: ${{ github.workspace }}/${{ matrix.executable }}
        # Test homes leave the Windows OS disk (docs/release.md "Desktop end-to-end suite").
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"; fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:desktop:packaged
          else
            npm run test:desktop:packaged
          fi

      # sign-windows signs and packs this directory as the suite left it, so it must still hold no runtime leftovers such as __pycache__.
      - name: Verify the tested Windows app is still clean
        if: matrix.os == 'win32'
        run: node scripts/verify-desktop-package.mjs --platform ${{ matrix.os }} --arch ${{ matrix.arch }} --app "${{ matrix.appDir }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'win32'
        with:
          name: unpacked-${{ matrix.target }}
          path: ${{ matrix.appDir }}
          retention-days: 1
          if-no-files-found: error

      - name: Verify this leg's release artifacts
        if: matrix.os != 'win32'
        run: node scripts/release-targets.mjs --check-desktop-artifacts ${{ matrix.target }} dist-desktop

      # Version N+1 of the same tree for desktop-update-test; never attached to the release.
      - name: Build update-test version N+1
        if: matrix.updateFeed
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          next=$(node -p "const [a, b, c] = require('./package.json').version.split('-')[0].split('.').map(Number); [a, b, c + 1].join('.')")
          channel_flag=()
          if [ -n "$CHANNEL" ]; then channel_flag=("-c.publish.channel=$CHANNEL"); fi
          npx electron-builder --${{ matrix.builder }} ${{ matrix.updateFeed }} --${{ matrix.arch }} --publish never "${channel_flag[@]}" \
            -c.extraMetadata.version="$next" -c.directories.output=dist-desktop/next

      # sign-windows uploads the Windows legs' desktop-<target> artifacts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os != 'win32'
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.deb
            dist-desktop/*.rpm
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.updateFeed
        with:
          name: update-feed-${{ matrix.target }}
          path: |
            dist-desktop/next/*.exe
            dist-desktop/next/*.zip
            dist-desktop/next/*.deb
            dist-desktop/next/*.blockmap
            dist-desktop/next/latest*.yml
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-${{ matrix.target }}
          path: |
            dist/e2e-report
            dist/e2e-results
          retention-days: 7
          if-no-files-found: ignore

  # Signs both Windows apps' Damocles.exe, builds their installers from the signed apps, signs the installers and rebuilds the update feeds from
  # the signed files (docs/desktop-signing.md "The signing job structure"). A tag signs with the SignPath Foundation release
  # certificate, a manual run with `sign` on with the self-signed test certificate. A manual run with `sign` off skips every SignPath step and
  # builds the installers from the unsigned apps, so the install and update tests still run. It waits for every job that does not test the
  # signed files, so a run that fails a check never spends SignPath's yearly artifact quota (release-targets.test.ts enforces this).
  sign-windows:
    needs: [verify, package, package-desktop, e2e-desktop, verify-desktop-install, desktop-update-test]
    runs-on: windows-latest
    # Two signing requests, each waiting up to an hour for a human approval, plus npm ci and the installer builds.
    timeout-minutes: 150
    permissions:
      contents: read
      # The SignPath action reads this run's job details and downloads its artifacts with the job token.
      actions: read
    env:
      SIGNPATH_ORGANIZATION_ID: 567f8646-d332-4f0e-88a9-7f2a21e285d9
      SIGNPATH_PROJECT_SLUG: damocles
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ github.event_name == 'push' && 'release-signing' || 'test-signing' }}
      SIGN_WINDOWS: ${{ github.event_name == 'push' || inputs.sign }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: jobs that run install scripts write the shared cache, and this job holds the SignPath token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # electron-builder and the check scripts run from the lockfile. No install script runs in a job that holds the SignPath token.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The package check compares the apps' grammars and wake models with these.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unpacked-win-x64
          path: unsigned/x64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unpacked-win-arm64
          path: unsigned/arm64

      # SignPath's artifact configurations restrict each signed file's product version to this one.
      - name: Read the release version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Only Damocles.exe is built from this repository; the upstream binaries ship as their projects publish them (SignPath
      # Foundation terms). SignPath signs only an artifact of this run, and this zip holds x64/ and arm64/, the layout of the
      # app-executables artifact configuration.
      - name: Collect the executables to sign
        id: collect-executables
        if: env.SIGN_WINDOWS == 'true'
        run: |
          mkdir -p executables/x64 executables/arm64
          cp unsigned/x64/Damocles.exe executables/x64/
          cp unsigned/arm64/Damocles.exe executables/arm64/

      - name: Upload the unsigned executables for SignPath
        id: upload-unsigned-executables
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-win-executables
          path: executables/
          retention-days: 1
          if-no-files-found: error

      - name: Sign both executables
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-executables
          github-artifact-id: ${{ steps.upload-unsigned-executables.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-executables

      # With signing off, signed/ holds the apps unchanged.
      - name: Put the signed executables into the apps
        run: |
          mv unsigned signed
          if [ "$SIGN_WINDOWS" = true ]; then
            cp signed-executables/x64/Damocles.exe signed/x64/Damocles.exe
            cp signed-executables/arm64/Damocles.exe signed/arm64/Damocles.exe
          fi

      # Signing must leave the fuse wire, the asar integrity hash, the tree and resources/app-update.yml as package-desktop checked them.
      - name: Verify the signed apps
        run: |
          node scripts/verify-desktop-package.mjs --platform win32 --arch x64 --app signed/x64
          node scripts/verify-desktop-package.mjs --platform win32 --arch arm64 --app signed/arm64

      - name: Check both executables are signed
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: ./scripts/check-authenticode.ps1 -Path signed/x64/Damocles.exe, signed/arm64/Damocles.exe -RequireTrusted:($env:SIGNPATH_SIGNING_POLICY_SLUG -eq 'release-signing')

      # No certificate is in the environment, so electron-builder signs nothing, and signAndEditExecutable=false keeps it from editing the signed binaries.
      - name: Build both installers from the signed apps
        run: |
          npx electron-builder --win nsis --x64 --prepackaged signed/x64 --publish never -c.publish.channel=latest-x64 -c.win.signAndEditExecutable=false
          npx electron-builder --win nsis --arm64 --prepackaged signed/arm64 --publish never -c.publish.channel=latest-arm64 -c.win.signAndEditExecutable=false

      - name: Verify the unsigned installers' names
        run: node scripts/release-targets.mjs --check-desktop-artifacts win-x64,win-arm64 dist-desktop

      - name: Upload the unsigned installers for SignPath
        id: upload-unsigned-installers
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-win-installers
          path: dist-desktop/Damocles-Setup-*.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign both installers
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-unsigned-installers.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installers

      - name: Replace the installers with the signed ones and rebuild their update feeds
        if: env.SIGN_WINDOWS == 'true'
        run: |
          cp signed-installers/Damocles-Setup-*.exe dist-desktop/
          node scripts/signed-windows-feed.mjs --rewrite dist-desktop x64 arm64

      - name: Check the installers' signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: ./scripts/check-authenticode.ps1 -Path (@((Get-ChildItem dist-desktop -Filter 'Damocles-Setup-*.exe').FullName) + @('signed/x64/Damocles.exe', 'signed/arm64/Damocles.exe')) -RequireTrusted:($env:SIGNPATH_SIGNING_POLICY_SLUG -eq 'release-signing')

      # The release attaches these files, so every feed entry must describe the installers' final bytes.
      - name: Check the installers' feeds and names
        shell: pwsh
        run: |
          node scripts/signed-windows-feed.mjs --check dist-desktop x64 arm64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/release-targets.mjs --check-desktop-artifacts win-x64,win-arm64 dist-desktop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-win-x64
          path: |
            dist-desktop/Damocles-Setup-*-x64.exe
            dist-desktop/Damocles-Setup-*-x64.exe.blockmap
            dist-desktop/latest-x64.yml
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-win-arm64
          path: |
            dist-desktop/Damocles-Setup-*-arm64.exe
            dist-desktop/Damocles-Setup-*-arm64.exe.blockmap
            dist-desktop/latest-arm64.yml
          retention-days: 7
          if-no-files-found: error

  # The dev end-to-end suite, split into Playwright shards beside package-desktop, which runs only the packaged-app suite.
  # Keep each target's runner equal to its package-desktop leg (release-targets.test.ts fails on drift).
  e2e-desktop:
    needs: verify
    strategy:
      # Every shard reports all its failures; attest and release still need every shard.
      fail-fast: false
      matrix:
        target: [win-x64, win-arm64, mac-arm64, linux-x64, linux-arm64]
        shard: [1, 2, 3]
        exclude:
          - target: linux-x64
            shard: 3
          - target: linux-arm64
            shard: 3
        include:
          - target: win-x64
            runner: windows-latest
            os: win32
            shards: 3
          - target: win-arm64
            runner: windows-11-arm
            os: win32
            shards: 3
          - target: mac-arm64
            runner: macos-latest
            os: darwin
            shards: 3
          - target: linux-x64
            runner: ubuntu-latest
            os: linux
            shards: 2
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            shards: 2
    runs-on: ${{ matrix.runner }}
    # npm ci, the suite step's limit and the report upload (docs/release.md "Time limits").
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Xvfb and a window manager
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched-assets

      # The electron package has no install script and downloads its binary on first require, which the setuid step below and two parallel Playwright workers cannot wait for.
      - name: Download the Electron binary
        run: npx --no install-electron

      # Ubuntu 24.04 restricts unprivileged user namespaces for binaries without an AppArmor profile, so Chromium needs its setuid helper; the sandbox stays on.
      - name: Enable the setuid sandbox helper of the dev Electron binary
        if: matrix.os == 'linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # test:desktop builds the webview and the desktop app itself; the suite never loads dist/extension.js.
      # Linux: minimizing needs a window manager and the pane tests size the window to 1400x900. playwright.desktop.config.ts
      # sets the worker count per platform.
      - name: Desktop end-to-end suite (shard ${{ matrix.shard }} of ${{ matrix.shards }})
        # Outlasts globalTimeout plus test:desktop's build; fails only this step, so the upload still runs (docs/release.md "Time limits").
        timeout-minutes: 55
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        # Test homes leave the Windows OS disk (docs/release.md "Desktop end-to-end suite").
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"; fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s '-screen 0 1920x1080x24' sh -c 'openbox & exec npm run test:desktop -- --shard="$SHARD"'
          else
            npm run test:desktop -- --shard="$SHARD"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-${{ matrix.target }}-${{ matrix.shard }}
          path: |
            dist/e2e-report
            dist/e2e-results
          retention-days: 7
          if-no-files-found: ignore

  # Fresh runners install what package-desktop built, as a user would. The Windows leg is verify-desktop-install-windows, which
  # needs sign-windows; this job runs before signing, so its failures spend no SignPath quota.
  verify-desktop-install:
    needs: package-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: deb
            runner: ubuntu-24.04
            artifact: desktop-linux-x64
          - check: rpm
            runner: ubuntu-24.04
            artifact: desktop-linux-x64
          - check: dmg
            runner: macos-latest
            artifact: desktop-mac-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps: &verify-desktop-install-steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: installers

      - name: Install the deb and launch it with the Chromium sandbox on
        if: matrix.check == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils
          deb=$(ls installers/damocles_*_amd64.deb)
          sudo apt-get install -y "./$deb"
          test -x /opt/Damocles/damocles
          grep -q '^provider: github' /opt/Damocles/resources/app-update.yml
          # electron-updater picks its Linux installer (dpkg or rpm) from this file.
          grep -qx deb /opt/Damocles/resources/package-type
          apparmor=N
          if [ "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo N)" = Y ]; then
            apparmor=Y
            if ! sudo grep -E '^damocles ' /sys/kernel/security/apparmor/profiles; then
              echo "ERROR: AppArmor is active but the damocles profile is not loaded" >&2
              exit 1
            fi
          else
            echo "AppArmor is not active on this runner; the profile load check does not apply."
          fi
          work=$(mktemp -d)
          cat > "$work/launch.sh" <<'EOF'
          set -euo pipefail
          work="$1"
          HOME="$work" /opt/Damocles/damocles --user-data-dir="$work/user-data" > "$work/app.log" 2>&1 &
          app=$!
          shown=0
          for _ in $(seq 1 90); do
            if ! kill -0 "$app" 2>/dev/null; then break; fi
            # Output is captured before grep -q reads it: under pipefail, grep -q exiting at its first match kills the writer with SIGPIPE.
            windows=$(xwininfo -root -tree)
            if grep -qiE 'damocles.*[0-9]{3,}x[0-9]{3,}\+' <<<"$windows"; then shown=1; break; fi
            sleep 1
          done
          if [ "$shown" != 1 ]; then
            echo "ERROR: no Damocles window within 90 s" >&2
            cat "$work/app.log" >&2
            exit 1
          fi
          sleep 5
          renderer=""
          for pid in $(pgrep -f '^/opt/Damocles/damocles'); do
            # A helper process can exit between pgrep and this read.
            args=$(tr '\0' ' ' 2>/dev/null < "/proc/$pid/cmdline") || continue
            echo "$pid: $args"
            case "$args" in
              *--no-sandbox*) echo "ERROR: process $pid runs with --no-sandbox" >&2; exit 1 ;;
              *--type=renderer*) renderer="$pid" ;;
            esac
          done
          if [ -z "$renderer" ]; then
            echo "ERROR: no renderer process found" >&2
            exit 1
          fi
          # A sandboxed Chromium renderer runs under a seccomp-bpf filter (mode 2).
          if ! grep -E '^Seccomp:[[:space:]]+2$' "/proc/$renderer/status"; then
            echo "ERROR: renderer $renderer is not under the seccomp sandbox" >&2
            exit 1
          fi
          # Both Chromium sandboxes give the renderer its own pid namespace; only the user namespace sandbox, which the AppArmor profile enables, gives it its own user namespace.
          if [ "$(sudo readlink "/proc/$renderer/ns/pid")" = "$(sudo readlink "/proc/$app/ns/pid")" ]; then
            echo "ERROR: renderer $renderer shares the browser's pid namespace" >&2
            exit 1
          fi
          if [ "$2" = Y ] && [ "$(sudo readlink "/proc/$renderer/ns/user")" = "$(sudo readlink "/proc/$app/ns/user")" ]; then
            echo "ERROR: AppArmor is active but renderer $renderer is not in its own user namespace, so the profile did not enable the user namespace sandbox" >&2
            exit 1
          fi
          if grep -iE 'no usable sandbox|sandbox helper binary' "$work/app.log"; then
            echo "ERROR: Chromium reported a sandbox failure" >&2
            exit 1
          fi
          kill "$app"
          EOF
          xvfb-run -a bash "$work/launch.sh" "$work" "$apparmor"

      - name: Install the rpm in Fedora and check its files
        if: matrix.check == 'rpm'
        shell: bash
        # The current Fedora release, so this check never runs on an end-of-life one.
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/installers:/installers:ro" fedora:latest bash -euo pipefail -c '
            rpm=$(ls /installers/damocles-*.x86_64.rpm)
            # Captured before grep -q reads it: under pipefail, grep -q exiting at its first match kills rpm with SIGPIPE (exit 141).
            scripts=$(rpm -qp --scripts "$rpm")
            grep -q apparmor <<<"$scripts"
            # Fedora has no AppArmor, so this also proves the scripts never fail the install without it.
            dnf install -y "$rpm"
            test -x /opt/Damocles/damocles
            test -f /opt/Damocles/resources/app.asar
            test -d /opt/Damocles/resources/app.asar.unpacked
            grep -q "^provider: github" /opt/Damocles/resources/app-update.yml
            grep -qx rpm /opt/Damocles/resources/package-type
            files=$(rpm -ql damocles)
            grep -q apparmor <<<"$files"
            dnf remove -y damocles
            test ! -e /opt/Damocles
          '

      # CGWindowList reports window owners without accessibility or screen recording permission, and needs no npm install on the fresh runner.
      - name: Install the dmg into /Applications and launch it to its first window
        if: matrix.check == 'dmg'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls installers/Damocles-*-arm64.dmg)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          cp -R "$mount/Damocles.app" /Applications/
          hdiutil detach "$mount"
          codesign --verify --deep --strict /Applications/Damocles.app
          # Captured before grep -q reads it: under pipefail, grep -q exiting at its first match kills the writer with SIGPIPE.
          signature=$(codesign -dv /Applications/Damocles.app 2>&1)
          grep -q 'Signature=adhoc' <<<"$signature"
          grep -q '^provider: github' /Applications/Damocles.app/Contents/Resources/app-update.yml
          cat > "$RUNNER_TEMP/windows.swift" <<'EOF'
          import CoreGraphics
          let windows = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]] ?? []
          let shown = windows.filter { window in
            guard window[kCGWindowOwnerName as String] as? String == "Damocles",
                  window[kCGWindowLayer as String] as? Int == 0,
                  let bounds = window[kCGWindowBounds as String] as? [String: Any],
                  let height = bounds["Height"] as? Double else { return false }
            return height >= 200
          }
          print(shown.count)
          EOF
          swiftc -o "$RUNNER_TEMP/windows" "$RUNNER_TEMP/windows.swift"
          # The runner's Keychain would prompt modally and block the main thread before the first window, as in the e2e launchers.
          open -n /Applications/Damocles.app --args --user-data-dir="$RUNNER_TEMP/user-data" --use-mock-keychain
          shown=0
          for _ in $(seq 1 90); do
            if [ "$("$RUNNER_TEMP/windows")" -gt 0 ]; then shown=1; break; fi
            sleep 1
          done
          if [ "$shown" != 1 ]; then
            echo "ERROR: no Damocles window within 90 s" >&2
            pgrep -lf Damocles >&2 || echo "No Damocles process is running." >&2
            exit 1
          fi
          pkill -x Damocles

      - name: Install the NSIS installer per user and launch it to its first window
        if: matrix.check == 'nsis'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem installers -Filter 'Damocles-Setup-*-x64.exe' | Select-Object -First 1
          $marker = Join-Path $env:USERPROFILE '.damocles\install-check-marker'
          New-Item -ItemType Directory -Force -Path (Split-Path $marker) | Out-Null
          Set-Content -Path $marker -Value 'kept'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The installer exited with $($install.ExitCode)" }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -like 'Damocles*' }
          if (-not $entry) { throw 'No per-user uninstall entry for Damocles under HKCU' }
          # electron-builder writes InstallLocation only to its own key; the uninstall entry locates the folder through its uninstaller.
          if ($entry.UninstallString -notmatch '^"([^"]+)"') { throw "Unexpected UninstallString: $($entry.UninstallString)" }
          $uninstaller = $Matches[1]
          $installDir = Split-Path -Parent $uninstaller
          if (-not $installDir.StartsWith("$env:LOCALAPPDATA\", [System.StringComparison]::OrdinalIgnoreCase)) { throw "Installed outside the user profile: $installDir" }
          $exe = Join-Path $installDir 'Damocles.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing after install" }
          $feed = Get-Content -Raw (Join-Path $installDir 'resources\app-update.yml')
          if ($feed -notmatch '(?m)^provider: github' -or $feed -notmatch '(?m)^channel: latest-x64') { throw "resources\app-update.yml does not name the GitHub feed on channel latest-x64: $feed" }
          $userData = Join-Path $env:RUNNER_TEMP 'user-data'
          $app = Start-Process -FilePath $exe -ArgumentList "--user-data-dir=`"$userData`"" -PassThru
          $shown = $false
          for ($i = 0; $i -lt 90; $i++) {
            $app.Refresh()
            if ($app.HasExited) { throw "Damocles exited with $($app.ExitCode) before showing a window" }
            if ($app.MainWindowHandle -ne 0) { $shown = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $shown) { throw 'No Damocles window within 90 s' }
          Get-Process -Name Damocles | Stop-Process -Force
          Start-Sleep -Seconds 3
          Start-Process -FilePath $uninstaller -ArgumentList '/S', '/currentuser' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "$exe is still present after uninstall" }
          if (-not (Test-Path $marker)) { throw 'The uninstaller removed ~/.damocles' }

  # verify-desktop-install's steps on the installer sign-windows signed.
  verify-desktop-install-windows:
    needs: sign-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: nsis
            runner: windows-latest
            artifact: desktop-win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps: *verify-desktop-install-steps

  # Installs version N, serves N+1 from a loopback feed, and checks the update applies (Linux) or the notice opens the release page
  # (macOS). The Windows leg is desktop-update-test-windows, which needs sign-windows; this job runs before signing.
  desktop-update-test:
    needs: package-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            installer: damocles_VERSION_amd64.deb
          - target: mac-arm64
            runner: macos-latest
            platform: darwin
            installer: Damocles-VERSION-arm64.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps: &desktop-update-test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/desktop/update/package-lock.json

      # The driver drives the installed app over CDP with playwright-core alone, pinned in its own lockfile; the repository's
      # full install takes 11 to 17 minutes on windows-11-arm.
      - name: Install the update driver's dependencies
        run: npm ci --prefix e2e/desktop/update --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: installers

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-feed-${{ matrix.target }}
          path: feed

      # electron-updater elevates through pkexec when it exists and falls back to sudo otherwise; installing polkit tests the path a desktop user gets.
      - name: Install Xvfb and polkit
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb pkexec polkitd

      - name: Update the installed version N to N+1 from a local feed
        env:
          INSTALLER_TEMPLATE: ${{ matrix.installer }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          from=$(node -p "require('./package.json').version")
          to=$(sed -n 's/^version: //p' feed/latest*.yml | tr -d '\r')
          installer="installers/${INSTALLER_TEMPLATE//VERSION/$from}"
          args=(e2e/desktop/update/drive-update.mjs --platform "$PLATFORM" --installer "$installer" --feed-dir feed
            --from-version "$from" --to-version "$to" --work-dir "$RUNNER_TEMP/update-test")
          if [ "$PLATFORM" = linux ]; then
            xvfb-run -a node "${args[@]}" --grant-pkexec
          else
            node "${args[@]}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: update-test-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/update-test/**/*.log
            ${{ runner.temp }}/update-test/drive-update.json
          retention-days: 7
          if-no-files-found: ignore

  # desktop-update-test's steps on the installer sign-windows signed.
  desktop-update-test-windows:
    needs: sign-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-arm64
            runner: windows-11-arm
            platform: win32
            installer: Damocles-Setup-VERSION-arm64.exe
    runs-on: ${{ matrix.runner }}
    # On windows-11-arm the install, the update and the uninstall each take 5 to 9 minutes while Defender scans the new binaries.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps: *desktop-update-test-steps

  # Checks the run produced every release artifact and writes the release notes. A manual run runs it too, so a dry run checks
  # everything release reads; release only publishes.
  release-notes:
    needs: [package, package-desktop, sign-windows, e2e-desktop, verify-desktop-install, verify-desktop-install-windows, desktop-update-test, desktop-update-test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          pattern: vsix-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Verify the run produced every VSIX and desktop artifact
        run: |
          node --input-type=module -e "
            import { existsSync } from 'node:fs';
            import { RELEASE_TARGETS } from './scripts/release-targets.mjs';
            const missing = Object.keys(RELEASE_TARGETS)
              .map((target) => 'dist-artifacts/damocles-' + target + '-' + process.env.GITHUB_REF_NAME + '.vsix')
              .filter((file) => !existsSync(file));
            if (missing.length) { console.error('Missing VSIXes: ' + missing.join(', ')); process.exit(1); }
          "
          node scripts/release-targets.mjs --check-desktop-artifacts all dist-artifacts

      - name: Extract changelog section
        run: |
          # package.json, not the tag: verify holds them equal on a tag push, and a manual run has no tag.
          # A manual run takes [Unreleased] while the changelog has it; must match checkChangelog in verify-desktop-package.mjs.
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" != tag ] && grep -q '^## \[Unreleased\]' CHANGELOG.md; then version=Unreleased; fi
          mkdir -p "$RUNNER_TEMP/release-notes"
          awk -v ver="$version" '
            BEGIN { found=0 }
            /^## / {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes/release-body.md"
          if [ ! -s "$RUNNER_TEMP/release-notes/release-body.md" ]; then
            echo "ERROR: No changelog section found for version $version" >&2
            exit 1
          fi
          cat >> "$RUNNER_TEMP/release-notes/release-body.md" <<'EOF'

          ## Desktop app

          Installers for Windows 10 or later (x64, arm64), macOS 13 or later (Apple silicon) and Linux (x64, arm64; deb and rpm) are attached below. 64-bit only.

          - **Windows**: the installer and the app are code signed by SignPath Foundation. Until the certificate has built a reputation, SmartScreen can still warn before the first run: choose More info > Run anyway. It installs per user and updates itself: it downloads a new version in the background, checks it is signed by SignPath Foundation, and asks before restarting.
          - **macOS**: the app is ad hoc signed, not notarized. On macOS 15 and later, open it once, then approve it under System Settings > Privacy & Security > Open Anyway; each new version needs this approval again. The app does not update itself on macOS: it shows a notice that opens the new release page. Voice is unavailable on macOS. macOS builds are verified by CI only, not by hand.
          - **Linux**: the deb and rpm install an AppArmor profile so the Chromium sandbox works on Ubuntu 24.04 and later. Updates download in the background and ask for an administrator password to install.

          Code signing policy and privacy statement: https://github.com/AizenvoltPrime/damocles#code-signing-policy

          Verifying a download: `SHA256SUMS` lists the SHA-256 of every file attached here (`sha256sum -c SHA256SUMS --ignore-missing` in the download folder), and every file except `SHA256SUMS` has a GitHub build provenance attestation (`gh attestation verify <file> --repo AizenvoltPrime/damocles`).
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/release-body.md
          retention-days: 7
          if-no-files-found: error

  # Build provenance for every file the release attaches. The OIDC token this job can mint signs attestations, so the job
  # holds no secret and installs and runs no package. Its subject-path list must equal the asset list in "Create GitHub Release".
  attest:
    needs: [package, package-desktop, sign-windows, e2e-desktop, verify-desktop-install, verify-desktop-install-windows, desktop-update-test, desktop-update-test-windows, release-notes]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          pattern: vsix-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          pattern: desktop-*
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-artifacts/*.vsix
            dist-artifacts/*.exe
            dist-artifacts/*.dmg
            dist-artifacts/*.zip
            dist-artifacts/*.deb
            dist-artifacts/*.rpm
            dist-artifacts/*.blockmap
            dist-artifacts/latest*.yml

  release:
    needs: [package, package-desktop, sign-windows, e2e-desktop, verify-desktop-install, verify-desktop-install-windows, desktop-update-test, desktop-update-test-windows, release-notes, attest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Only this job writes: `gh release create` authenticates with the job's own GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: jobs that run install scripts write the shared cache, and this job holds the publish tokens.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # vsce and ovsx run from the lockfile. No install script runs in a job that holds the publish tokens.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          pattern: vsix-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          pattern: desktop-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      # SHA256SUMS holds bare file names, so `sha256sum -c` runs in the folder the files were downloaded to.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist-artifacts/*.vsix
            dist-artifacts/*.exe
            dist-artifacts/*.dmg
            dist-artifacts/*.zip
            dist-artifacts/*.deb
            dist-artifacts/*.rpm
            dist-artifacts/*.blockmap
            dist-artifacts/latest*.yml
          )
          (cd dist-artifacts && sha256sum -- "${assets[@]#dist-artifacts/}") > dist-artifacts/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes/release-body.md" \
            "${assets[@]}" dist-artifacts/SHA256SUMS

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: |
          publish_with_retry() {
            local vsix="$1"
            local max_attempts=4
            local attempt=1
            local log
            log=$(mktemp)
            while [ "$attempt" -le "$max_attempts" ]; do
              if node_modules/.bin/vsce publish --packagePath "$vsix" --pat "$VSCE_PAT" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if grep -qiE "already exists|already published" "$log"; then
                echo "Skipping $vsix - already published"
                return 0
              fi
              local delay=$((attempt * 15))
              echo "Attempt $attempt failed for $vsix; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            echo "ERROR: Failed to publish $vsix after $max_attempts attempts" >&2
            return 1
          }
          for vsix in dist-artifacts/*.vsix; do
            echo "Publishing to VS Marketplace: $vsix"
            publish_with_retry "$vsix"
          done

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: |
          publish_with_retry() {
            local vsix="$1"
            local max_attempts=4
            local attempt=1
            local log
            log=$(mktemp)
            while [ "$attempt" -le "$max_attempts" ]; do
              if node_modules/.bin/ovsx publish "$vsix" -p "$OVSX_PAT" >"$log" 2>&1; then
                cat "$log"
                return 0
              fi
              cat "$log"
              if grep -qiE "already exists|already published|conflict" "$log"; then
                echo "Skipping $vsix - already published"
                return 0
              fi
              local delay=$((attempt * 15))
              echo "Attempt $attempt failed for $vsix; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            echo "ERROR: Failed to publish $vsix after $max_attempts attempts" >&2
            return 1
          }
          for vsix in dist-artifacts/*.vsix; do
            echo "Publishing to Open VSX: $vsix"
            publish_with_retry "$vsix"
          done
