name: Create Release from Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and build vsix
        run: npm ci && npm run build && npx @vscode/vsce package

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          # Extract content between this version's header and the next version header
          body=$(awk -v ver="$version" '
            BEGIN { found=0 }
            /^## / {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          echo "$body" > /tmp/release-body.md

      - name: Get commit subject for title
        id: title
        run: |
          subject=$(git log -1 --format="%s" "$GITHUB_REF_NAME")
          # Strip conventional commit prefix if it matches the release pattern
          clean="${subject#feat(release): }"
          echo "title=$clean" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.title.outputs.title }}" \
            --notes-file /tmp/release-body.md \
            damocles-${{ steps.version.outputs.version }}.vsix
        env:
          GH_TOKEN: ${{ secrets.PAT }}
